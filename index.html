<style>
  :root{
    --brown:#1A0800;
    --brown-panel:#2A1206;
    --orange:#FF5500;
    --cream:#FFE8D6;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--brown);
    color:var(--white);
    font-family:'Poppins',sans-serif;
    height:100dvh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  .bg-shape{
    position:fixed;
    top:-30vh; right:-30vw;
    width:80vw; height:80vh;
    background:radial-gradient(circle at 30% 30%, rgba(255,85,0,0.35), transparent 60%);
    pointer-events:none;
    z-index:0;
  }
  .page{
    position:relative;
    z-index:1;
    width:100%;
    max-width:460px;
    height:100%;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 24px calc(env(safe-area-inset-bottom,0px) + 16px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    text-align:center;
  }
  .top{
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:0 0 auto;
  }
  img.logo{
    width:clamp(90px,26vh,180px);
    height:clamp(90px,26vh,180px);
    object-fit:contain;
    margin-bottom:4px;
  }
  .tagline{
    font-size:13px;
    color:var(--cream);
    opacity:0.85;
    margin:0;
    max-width:280px;
  }
  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:min(1.6vh,12px);
    flex:1 1 auto;
    min-height:0;
    overflow:hidden;
  }
  .link-btn{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:min(1.8vh,14px) 18px;
    background:var(--brown-panel);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:10px;
    text-decoration:none;
    color:var(--white);
    font-family:'Poppins',sans-serif;
    font-weight:500;
    font-size:15px;
    text-align:left;
    transition:transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    flex:0 0 auto;
  }
  .link-btn:hover, .link-btn:focus-visible{
    background:var(--orange);
    border-color:var(--orange);
    transform:translateY(-2px);
    color:var(--brown);
  }
  .link-btn:focus-visible{
    outline:2px solid var(--white);
    outline-offset:2px;
  }
  .link-btn .icon{
    width:20px; height:20px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .link-btn .icon svg{width:100%;height:100%;fill:currentColor;}
  .link-btn.primary{
    background:var(--orange);
    color:var(--brown);
    font-weight:600;
    border-color:var(--orange);
  }
  .link-btn.primary:hover{
    background:var(--white);
    border-color:var(--white);
  }
  footer{
    flex:0 0 auto;
    font-size:11px;
    color:var(--cream);
    opacity:0.6;
    letter-spacing:0.02em;
  }
  footer a{color:var(--orange);text-decoration:none;opacity:1;}

  @media (prefers-reduced-motion: reduce){
    .link-btn{transition:none;}
  }
</style>
